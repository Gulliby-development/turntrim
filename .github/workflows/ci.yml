name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::lintr, any::styler
          needs: check
      # replace the two commands with the README's own; block scalars and bash keep a colon or a quote in the R code from breaking the YAML
      - name: Tests
        shell: bash
        run: |
          Rscript -e 'testthat::test_local()'
      - name: Lint
        shell: bash
        run: |
          Rscript -e 'l <- lintr::lint_package(); print(l); quit(status = as.integer(length(l) > 0))'
